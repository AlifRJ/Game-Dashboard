services:
    # PostgreSQL Service
    postgres:
        image: postgres:16-alpine
        container_name: herd_postgres
        restart: unless-stopped
        ports:
            - "5433:5432"
        environment:
            POSTGRES_DB: "${DB_DATABASE:-laravel}"
            POSTGRES_USER: "${DB_USERNAME:-postgres}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-laravel}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    # Redis Service
    redis:
        image: redis:alpine
        container_name: herd_redis
        restart: unless-stopped
        ports:
            - "6380:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local
